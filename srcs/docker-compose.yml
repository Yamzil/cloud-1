services:

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cloud_network
    restart: unless-stopped

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file: .env
    volumes:
      - wp_data:/var/www/html
    networks:
      - cloud_network
    restart: unless-stopped
    depends_on:
      - mariadb

  phpmyadmin:
    build: ./requirements/phpmyadmin
    container_name: phpmyadmin
    env_file: .env
    volumes:
      - wp_data:/var/www/html
    networks:
      - cloud_network
    restart: unless-stopped
    depends_on:
      - mariadb

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    env_file: .env
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html
    networks:
      - cloud_network
    restart: unless-stopped
    depends_on:
      - wordpress
      - phpmyadmin

networks:
  cloud_network:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yamzil/data/db

  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yamzil/data/wp